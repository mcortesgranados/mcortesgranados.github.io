# Q49 — the specification itself.
#
# Written for the person integrating, not for the person who wrote the code. Every
# operation has an operationId, a summary, a description that answers the question the
# consumer actually has, a tag, and every status it can return. Every schema carries a
# realistic example. The governance extensions (`x-owner`, `x-tier`, `x-rate-limit`) are
# required by the house ruleset, so the catalogue can be built from the documents rather
# than maintained beside them.
openapi: 3.1.0

info:
  title: Orders API
  version: 2.3.0
  summary: Create, read and confirm orders.
  description: |
    The Orders API manages the lifecycle of a customer order: creating it from a set of
    lines, reading it back, and confirming it so that fulfilment begins.

    **Before you start**

    - Every request needs a bearer token from `https://auth.example.com`. See
      [Authentication](#section/Authentication/bearerAuth) for the token endpoint and the
      scopes each operation requires.
    - Requests are limited to **600 per minute per client**, and the limit is applied per
      client id rather than per IP. When you exceed it the response is `429` with a
      `Retry-After` header.
    - All timestamps are UTC in ISO 8601 format. Amounts are decimal numbers in the major
      unit of the currency, never formatted strings.
    - Breaking changes are never made inside a major version. The policy, including how
      deprecation works and how much notice you get, is in the
      [versioning policy](https://docs.example.com/api/versioning).

    **Error handling**

    Every failure returns `application/problem+json` with the same shape, so one parser
    handles all of them. Validation failures include an `errors` map keyed by field.
  contact:
    name: Orders team
    url: https://docs.example.com/teams/orders
    email: orders-api@example.com
  license:
    name: Proprietary
  termsOfService: https://docs.example.com/api/terms

servers:
  - url: https://api.example.com/api/v2
    description: Production. Stable; breaking changes only with a new major version.
  - url: https://api.sandbox.example.com/api/v2
    description: Sandbox. Same contract, synthetic data, reset nightly.

tags:
  - name: Orders
    description: Create, read and confirm orders.
    externalDocs:
      url: https://docs.example.com/guides/orders-lifecycle
      description: The order lifecycle, with the state diagram.

security:
  - bearerAuth: []

paths:
  /orders:
    get:
      operationId: listOrders
      summary: List the caller's orders
      description: |
        Returns a cursor-paginated list of orders belonging to the authenticated tenant.

        Results are eventually consistent by up to about two seconds, which is invisible on
        a list but matters if you are reading immediately after writing — in that case read
        the order by its id, which is served from the primary.

        **Pagination.** Follow `nextCursor` until it is absent. The cursor is opaque;
        do not construct one.
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - name: status
          in: query
          description: Return only orders in this state.
          required: false
          schema:
            type: string
            enum: [open, confirmed, cancelled]
            example: confirmed
        - name: sort
          in: query
          description: |
            Sort expression. Prefix with `-` for descending. Only `createdAt` and
            `total` are sortable; anything else returns `400` rather than being ignored.
          required: false
          schema:
            type: string
            default: '-createdAt'
            example: '-createdAt'
      responses:
        '200':
          description: A page of orders. `nextCursor` is absent on the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              example:
                items:
                  - id: 7f3c19e2-8c91-4d6a-9f20-1b7e5a2d6c34
                    status: confirmed
                    createdAt: '2026-03-04T10:15:30.000Z'
                    total: 129.9
                    currency: USD
                    lines:
                      - sku: ABC-1
                        quantity: 2
                        unitPrice: 19.9
                nextCursor: eyJpZCI6IjdmM2MxOWUyIn0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      operationId: createOrder
      summary: Create an order
      description: |
        Creates an order from a set of lines and returns it with its generated id.

        This operation is **not idempotent**. If you need a safe retry — for example after
        a timeout where the response was lost — send an `Idempotency-Key` header. Repeating
        a request with the same key and the same body returns the original response rather
        than creating a second order. The key is honoured for 24 hours.
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The lines to order. At least one line is required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              lines:
                - sku: ABC-1
                  quantity: 2
                  unitPrice: 19.9
              note: Deliver before Friday if possible.
      responses:
        '201':
          description: Created. The `Location` header contains the URL of the new order.
          headers:
            Location:
              description: Absolute URL of the created order.
              schema:
                type: string
                format: uri
                example: https://api.example.com/api/v2/orders/7f3c19e2-8c91-4d6a-9f20-1b7e5a2d6c34
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            The `Idempotency-Key` was already used with a **different** body. This is a
            client bug rather than a transient failure: reuse a key only for identical
            requests.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Read one order
      description: |
        Returns a single order. This read is served from the primary database, so it is
        immediately consistent: an order you have just created or confirmed is visible here
        without a delay.
      tags: [Orders]
      responses:
        '200':
          description: The order.
          headers:
            ETag:
              description: Use this value in `If-Match` when updating the order.
              schema:
                type: string
                example: W/"a1b2c3"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: |
            The order does not exist, **or** it belongs to another tenant. The two cases
            are deliberately indistinguishable so that the API does not confirm that an
            identifier exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: confirmOrder
      summary: Confirm an order
      description: |
        Moves the order to `confirmed` so fulfilment begins. A state transition is modelled
        as a sub-resource receiving `POST`, rather than a verb in the URL.

        Confirming an order that is already confirmed returns `409` and does not perform
        the transition twice, so a retry is safe to attempt.
      tags: [Orders]
      deprecated: false
      responses:
        '204':
          description: Confirmed. No body is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The order is already confirmed or has been cancelled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.example.com/problems/409
                title: Order cannot be confirmed
                status: 409
                detail: The order was cancelled on 2026-03-04T09:00:00Z.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  /orders/{orderId}/lines:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: addOrderLine
      summary: Add a line to an open order
      tags: [Orders]
      deprecated: true
      x-deprecation:
        since: '2026-01-15'
        sunset: '2026-06-30'
        replacement: 'PUT /api/v2/orders/{orderId} with the full set of lines'
        reason: |
          Adding lines one at a time made the resulting total non-deterministic under
          concurrent edits. Replacing the whole line set is unambiguous.
      description: |
        **Deprecated.** This operation stops accepting requests on **30 June 2026**.
        Migrate to `PUT /api/v2/orders/{orderId}`, which replaces the complete set of lines
        in one request. Until the sunset date both work; after it, this path returns `410`.
      responses:
        '201':
          description: The line was added and the order total updated.
        '410':
          description: The operation has been retired. Use `PUT /orders/{orderId}`.
        '409':
          description: The order is not open.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT from `https://auth.example.com/oauth/token`. Request it with the
        `client_credentials` flow for machine clients, or `authorization_code` with PKCE for
        user-facing ones. Required scopes are listed per operation under
        `x-required-scope`. The token is validated against the issuer's published keys, so
        a key rotation takes effect within a few minutes without any action on your side.

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: The order identifier, as returned by `createOrder`.
      schema:
        type: string
        format: uuid
        example: 7f3c19e2-8c91-4d6a-9f20-1b7e5a2d6c34
    PageSize:
      name: page[size]
      in: query
      required: false
      description: |
        Number of items per page. Defaults to 25 and is **capped at 100**: a larger value
        is accepted but returns 100 items, so you should not rely on requesting more.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
        example: 25
    PageAfter:
      name: page[after]
      in: query
      required: false
      description: |
        Opaque cursor from the previous page's `nextCursor`. Do not construct or modify it;
        a malformed cursor returns `400`.
      schema:
        type: string
        example: eyJpZCI6IjdmM2MxOWUyIn0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-generated key that makes a retry safe. Send the same key with the same
        body to receive the original response instead of creating a second order. Keys are
        honoured for 24 hours. Use a UUID.
      schema:
        type: string
        maxLength: 64
        example: 0f8fad5b-d9cb-469f-a165-70867728950e

  responses:
    Unauthorized:
      description: |
        The token is missing, expired or not valid for this audience. Check that you are
        calling the environment the token was issued for.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: |
        The request was rejected. `errors` maps each invalid field to every reason it was
        rejected, so you can fix all of them in one round rather than one at a time.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.com/problems/validation
            title: Validation failed
            status: 400
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              'lines[0].quantity': ['Must be greater than zero.']
              note: ['Must be 256 characters or fewer.']
    TooManyRequests:
      description: |
        The per-client rate limit was exceeded. `Retry-After` gives the number of seconds to
        wait. Limits are per client id, not per IP, so a shared egress address does not
        consume your allowance.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 12
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Order:
      type: object
      description: A customer order and its lines.
      required: [id, status, createdAt, total, currency]
      properties:
        id:
          type: string
          format: uuid
          description: Stable identifier. Use it in preference to the order number.
          example: 7f3c19e2-8c91-4d6a-9f20-1b7e5a2d6c34
        status:
          type: string
          description: |
            Current state. `open` orders can be changed; `confirmed` ones are being
            fulfilled; `cancelled` ones are terminal.
          enum: [open, confirmed, cancelled]
          example: confirmed
        createdAt:
          type: string
          format: date-time
          description: When the order was created, in UTC.
          example: '2026-03-04T10:15:30.000Z'
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Absent while the order is open.
          example: '2026-03-04T10:20:00.000Z'
        total:
          type: number
          description: Gross total, in the major unit of `currency`. Decimal, not a string.
          example: 129.9
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: '^[A-Z]{3}$'
          example: USD
        lines:
          type: array
          description: The order lines. At least one is always present.
          items:
            $ref: '#/components/schemas/OrderLine'
      example:
        id: 7f3c19e2-8c91-4d6a-9f20-1b7e5a2d6c34
        status: confirmed
        createdAt: '2026-03-04T10:15:30.000Z'
        confirmedAt: '2026-03-04T10:20:00.000Z'
        total: 129.9
        currency: USD
        lines:
          - sku: ABC-1
            quantity: 2
            unitPrice: 19.9

    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
          description: Stock keeping unit. Must exist in the catalogue at creation time.
          maxLength: 64
          example: ABC-1
        quantity:
          type: integer
          description: Units ordered. Must be at least 1.
          minimum: 1
          example: 2
        unitPrice:
          type: number
          description: Price per unit at the time of the order, in the order currency.
          example: 19.9
      example:
        sku: ABC-1
        quantity: 2
        unitPrice: 19.9

    OrderPage:
      type: object
      description: One page of orders.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: string
          description: |
            Pass this as `page[after]` to fetch the next page. **Absent** when this is the
            last page, which is how you know to stop.
          example: eyJpZCI6IjdmM2MxOWUyIn0
      example:
        items: []
        nextCursor: eyJpZCI6IjdmM2MxOWUyIn0

    CreateOrderRequest:
      type: object
      description: The lines to order.
      required: [lines]
      properties:
        lines:
          type: array
          description: At least one line is required.
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
        note:
          type: string
          description: Free-text note for the fulfilment team. Not visible to the customer.
          maxLength: 256
          example: Deliver before Friday if possible.
      example:
        lines:
          - sku: ABC-1
            quantity: 2
            unitPrice: 19.9

    ProblemDetails:
      type: object
      description: |
        RFC 7807 problem details. The same shape is used for every failure, so one parser
        handles them all. `traceId` matches the server log entry for the request.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem class. Stable; safe to switch on.
          example: https://docs.example.com/problems/validation
        title:
          type: string
          description: Short, human-readable summary.
          example: Validation failed
        status:
          type: integer
          description: The same value as the HTTP status code.
          example: 400
        detail:
          type: string
          description: Explanation specific to this occurrence. Do not parse it.
          example: 'lines[0].quantity must be greater than zero.'
        traceId:
          type: string
          description: |
            Correlation identifier. Quote it when contacting support — it is the fastest way
            to find the request in our logs.
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: object
          description: Present only for validation failures.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            'lines[0].quantity': ['Must be greater than zero.']

# ---------------------------------------------------------------------------
# Governance extensions. Required by the house ruleset, and the reason the API
# catalogue can be generated from the documents instead of maintained beside them.
# ---------------------------------------------------------------------------
x-owner: orders-team
x-tier: 1
x-rate-limit:
  default: 600
  window: minute
  keyed-on: client-id
x-sla: '99.9% availability, p95 under 300 ms'
x-catalogue: https://docs.example.com/catalogue/orders-api
