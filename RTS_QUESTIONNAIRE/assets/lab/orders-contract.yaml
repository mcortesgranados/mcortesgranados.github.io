# Q28 — the orders resource as its consumers see it.
#
# This is the contract that the Angular SPA, QA and any other client integrate
# against. In the repositories I keep it in one of two places: generated from the
# endpoints at build time, or written first and asserted against the
# implementation by a contract test. Either way the document is never the only
# description of the API — it is checked.
openapi: 3.1.0

info:
  title: Orders API
  version: 1.0.0
  description: |
    Resource-oriented API for order handling. Collections are cursor paginated,
    every failure is returned as RFC 7807 problem details, and every endpoint
    requires an explicit authorisation policy.

servers:
  - url: https://api.example.com/api/v1
    description: Versioned base path. Breaking changes go to /api/v2, never into /api/v1.

paths:
  /orders:
    get:
      summary: List orders for the authenticated caller
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, confirmed, cancelled] }
        - name: sort
          in: query
          description: "-field for descending, e.g. -createdAt"
          schema: { type: string, default: "-createdAt" }
        - name: page[size]
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: page[after]
          in: query
          description: Opaque cursor returned as nextCursor by the previous page.
          schema: { type: string }
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create an order
      description: |
        Not idempotent. Clients that need a safe retry send an Idempotency-Key
        header; the same key returns the original response instead of creating a
        second order.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URI of the created order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The idempotency key was reused with a different payload.

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read one order
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order
          headers:
            ETag:
              schema: { type: string }
              description: Use this value in If-Match when updating.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Replace an order revision
      description: |
        Idempotent. If-Match is required, so a client that lost the race gets 412
        instead of overwriting a change it never saw.
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
      responses:
        "200":
          description: Replaced
        "412":
          description: The supplied ETag is stale.
        "428":
          description: If-Match was not supplied.
    delete:
      summary: Cancel an order
      description: Idempotent. Returns 204 whether the order was cancelled now or had already been cancelled.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No content
        "409":
          description: The order is in a state that cannot be cancelled.

  /orders/{orderId}/confirm:
    post:
      summary: Confirm an order
      description: |
        A state transition expressed as a sub-resource that receives POST, rather
        than a verb grafted onto the URL. Idempotent in effect: confirming an
        already confirmed order answers 409 with problem details.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Confirmed
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The order is already confirmed or cancelled.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cryptographically validated against the issuer JWKS; the subject and tenant come from the token, never from the body.

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: The resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    RateLimited:
      description: Caller exceeded the per-minute budget
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    Order:
      type: object
      required: [id, status, createdAt, total]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, confirmed, cancelled] }
        createdAt: { type: string, format: date-time }
        total: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number }
    OrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        nextCursor:
          type: string
          description: Absent when this is the last page.
    CreateOrderRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLine" }
    UpdateOrderRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 256 }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
